name: Inert retained verification archive fixture

on:
  push:
    branches: [codex/v2-public-retained-archive-20261123]
    paths:
      - .github/workflows/commentary-v2-retained-archive-fixture.yml
      - fixtures/commentary-v2-retained-archive/**

permissions:
  contents: read

jobs:
  inert-archive:
    if: github.repository == 'commentary-dev/commentary-markdown-core-fixtures' && github.ref == 'refs/heads/codex/v2-public-retained-archive-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: commentary-retained-archive-x07
          path: fixtures/commentary-v2-retained-archive/inert-report.xml
          archive: true
          if-no-files-found: error
          retention-days: 7
